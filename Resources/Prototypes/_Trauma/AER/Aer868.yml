- type: entity
  parent: Bookshelf
  id: AnomalousBookshelf
  name: "AER-868"
  components:
  - type: ApplyStatusEffectsNear
    range: 2.5
    tickRate: 1
    effect: AnomalousBookshelfEffects
    
- type: entity
  id: AnomalousBookshelfEffects
  parent: MobStatusEffectDebuff
  components:
  - type: AccumulationStatusEffect
    effects: 
    - !type:SpawnParticles
      particleProto: BloodParticles
    - !type:PopupMessage
      type: Local
      visualType: Medium
      messages: [ "effect-sleepy" ]
      probability: 1
    - !type:Explosion
      explosionType: Default
      maxIntensity: 2
      intensityPerUnit: 0.5
      intensitySlope: 4
      maxTotalIntensity: 1
    timeToTrigger: 
    - 5
    - 10
    - 15

    

